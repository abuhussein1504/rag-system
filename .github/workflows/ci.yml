name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ci
      APP_VERSION: "0"
      FILE_ALLOWED_TYPES: '["txt","md"]'
      FILE_MAX_SIZE: "1"
      DATA_DIR: data
      FILE_DEFAULT_CHUNK_SIZE: "1000"
      FILE_DEFAULT_OVERLAP_SIZE: "200"
      EMBEDDING_BACKEND: remote
      EMBEDDING_MODEL_ID: BAAI/bge-base-en-v1.5
      EMBEDDING_MODEL_SIZE: "768"
      VECTOR_DB_BACKEND: qdrant
      VECTOR_DB_PATH: data/indexes/qdrant
      GEMINI_API_KEY: "fake-key"
      GEMINI_MODEL_ID: "gemini-2.5-flash"
      OPENAI_API_BASE_URL: "http://fake-judge/v1"
      OPENAI_API_KEY: "fake-judge-key"
      OPENAI_MODEL_ID: "judge-model"
      GOOGLE_API_KEY: ""
      REMOTE_EMBEDDER_URL: ""
      VECTOR_DB_DISTANCE_METHOD: "cosine"
      DEFAULT_RETRIEVER: "hybrid"
      GENERATION_BACKEND: "openai_compatible"
      GENERATION_TEMPERATURE: "0.0"
      GENERATION_BASE_URL: "https://api.groq.com/openai/v1"
      GENERATION_API_KEY: ""
      GENERATION_MODEL_ID: "openai/gpt-oss-20b"
      JUDGE_MODEL_ID: "openai/gpt-oss-120b"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest